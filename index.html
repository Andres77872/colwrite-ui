<!doctype html>
<!-- No `class="dark"`: Tailwind v4 only enables the `dark:` variant when the
     stylesheet declares `@custom-variant dark`, which this project deliberately
     does not — the theme is single-mode. The class was inert, and left in place
     it would make any future `dark:` utility fail silently. The dark palette
     comes from `color-scheme` plus the tokens in src/styles/globals.css. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="ColWrite — a focused writing environment with an integrated AI assistant for composing, revising and structuring arXiv papers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ColWrite — Assistant writer for arXiv papers</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
